[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NexuraGrid/nxgterm"

[workspace.dependencies]
nxg-core = { path = "crates/nxg-core" }
nxg-pty = { path = "crates/nxg-pty" }
nxg-render = { path = "crates/nxg-render" }
nxg-config = { path = "crates/nxg-config" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
