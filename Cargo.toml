[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NexuraGrid/nxgterm"

[workspace.dependencies]
nxg-core = { path = "crates/nxg-core" }
nxg-pty = { path = "crates/nxg-pty" }
nxg-render = { path = "crates/nxg-render" }
nxg-config = { path = "crates/nxg-config" }
# External crates, at versions that build on the MSRV (1.87).
# Clipboard and PRIMARY selection. No image support; `wayland-data-control`
# reaches the Wayland clipboard without a focused surface (KDE, wlroots).
arboard = { version = "3.6", default-features = false, features = [
    "wayland-data-control",
] }
flate2 = "1"
fontdb = "0.24"
miniz_oxide = "0.8"
notify = "8"
png = "0.18"
# 0.9.4 uses `cast_signed` (Rust 1.87) without declaring a rust-version.
fontdue = "=0.9.3"
portable-pty = "0.9"
pollster = "1"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
softbuffer = "0.4"
toml = "1"
vte = "0.15"
# 27+ requires Rust 1.88; 26 declares 1.84. `webgpu` (wasm only) is left out.
wgpu = { version = "26", default-features = false, features = [
    "std",
    "parking_lot",
    "dx12",
    "metal",
    "vulkan",
    "gles",
    "wgsl",
] }
# Raw Win32 bindings for the winpty adapter (ConPTY probe, winpty.dll).
windows-sys = "0.61"
winit = "0.30"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
