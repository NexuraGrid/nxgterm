name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  profile:
    name: Tools profile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh profile/install.sh && shellcheck packaging/update-manifests.sh
      - name: install.sh dry run
        if: runner.os != 'Windows'
        run: |
          sh profile/install.sh --dry-run --yes
          sh profile/install.sh --dry-run --only yazi,bru --no-shell-init
          if sh profile/install.sh --only nope; then exit 1; fi
      - name: PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $issues = 'profile/install.ps1', 'packaging/windows/conpty/fetch-conpty.ps1' |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning,Error }
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }
      - name: install.ps1 dry run (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./profile/install.ps1 -DryRun -Yes
      - name: install.ps1 dry run (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./profile/install.ps1 -DryRun -Yes
          & ([scriptblock]::Create((Get-Content -Raw profile/install.ps1))) -DryRun -Only yazi,bru -NoShellInit
          if ($LASTEXITCODE -ne 0) { exit 1 }

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
