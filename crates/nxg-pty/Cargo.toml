[package]
name = "nxg-pty"
description = "PTY adapters: Unix pty, Windows ConPTY and winpty."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nxg-core.workspace = true
portable-pty.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[lints]
workspace = true

# Dev-only fixture capture tool; test = true so its pure parts run in `cargo test`.
[[example]]
name = "capture"
test = true
