ShortDescription: Fast, configurable, cross-platform terminal emulator.
Description: |-
  nxgterm is a terminal emulator written in Rust. It renders on the GPU and falls back to the CPU
  automatically, reads a TOML configuration with live reload and themes, and shows inline images
  through the Kitty graphics protocol and Sixel. On Windows it uses ConPTY and falls back to winpty
  on Windows Server 2016.
