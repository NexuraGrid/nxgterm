schema: spec-driven

context: |
  Project: nxgterm, a fast, configurable, cross-platform terminal emulator (v0.1.0).
  Tech stack: Rust 2024 edition, MSRV 1.87 (workspace rust-version), Cargo workspace with
    resolver 3. Key crates: vte 0.15 (VT parsing), portable-pty 0.9 (Unix pty / ConPTY),
    windows-sys 0.61 (winpty FFI), wgpu 30, softbuffer 0.4,
    winit 0.30, fontdb 0.24 + fontdue =0.9.3 (pinned: 0.9.4 needs Rust 1.87), toml 1,
    serde 1, notify 8, png 0.18, flate2 1.
  Architecture: Hexagonal. `nxg-core` is platform-agnostic and owns the domain
    (Terminal, Grid, ImageStore, kitty/sixel decoding) and the ports
    (`PtySession` = reader + `PtyControl` + `ChildProcess`, `Renderer`), plus
    `fallback::first_available` for runtime backend selection. Adapters:
    `nxg-pty` (native pty/ConPTY, embedded winpty), `nxg-render` (wgpu GPU, softbuffer CPU),
    `nxg-config` (pure TOML config, themes, paths). `nxgterm` is the composition root
    (winit event loop, key encoding, bindings, live reload).
  Platforms: Linux (X11/Wayland, glibc 2.35+), macOS 11+, Windows 10 / Windows Server 2016+.
  Testing: Strict TDD. Unit tests live next to the code (`#[cfg(test)]`), integration
    tests in `crates/*/tests/`. Pure logic is extracted from OS/GPU code so it is
    testable everywhere; GPU and font tests skip with a message when no adapter or
    system monospace font exists.
  CI: GitHub Actions matrix ubuntu-latest / windows-latest / macos-latest
    (fmt, clippy with -D warnings, tests), an MSRV 1.87 job, and a tools-profile job
    (shellcheck, PSScriptAnalyzer, dry runs on sh, pwsh and Windows PowerShell 5.1).
    Release workflow builds deb/rpm/tar.gz (x86_64, aarch64), msi/zip (x86_64),
    universal dmg/tar.gz, source tarball and SHA256SUMS.
  Style: Conventional commits. Comments explain why, not what. All artifacts in English.

rules:
  proposal:
    - Include rollback plan for risky changes
    - State which roadmap phase or recommendation (openspec/RECOMMENDATIONS.md) the change addresses
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Describe observable behavior only; never invent behavior not backed by code or tests
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Keep nxg-core free of OS, window and GPU APIs; new platform needs go behind a port
    - Any new dependency MUST build on Rust 1.87 (check its rust-version and transitive MSRV)
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Each implementation task pairs with its test (RED first)
  apply:
    guidelines:
      - Follow existing code patterns (ports in nxg-core, adapters in nxg-pty/nxg-render)
      - Use nxg_core::fallback::first_available for any runtime-selected backend
      - Log backend choices and skipped backends to stderr with the `nxgterm:` prefix
    tdd: true
    test_command: "cargo test --workspace"
  verify:
    test_command: "cargo test --workspace"
    build_command: "cargo +1.87 check --workspace --all-targets"
    lint_commands:
      - "cargo fmt --all --check"
      - "RUSTFLAGS=\"-D warnings\" cargo clippy --workspace --all-targets"
      - "cargo +1.87 check --workspace --all-targets"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
